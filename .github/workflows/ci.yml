name: ProcureSettle CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      # v4.4.0; immutable release commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # Test the PR head itself rather than GitHub's synthetic merge ref.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record checked-out source SHA
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          echo "Checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Install pinned Rust and WASM target
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          rustup target add --toolchain 1.95.0 wasm32v1-none
          rustc +1.95.0 --version

      - name: Check formatting
        run: cargo +1.95.0 fmt --all -- --check

      - name: Test workspace
        run: cargo +1.95.0 test --workspace --locked

      - name: Validate proof scripts and evidence bundles
        run: |
          python3 -m py_compile scripts/*.py
          python3 scripts/verify-evidence-checksums.py

      - name: Install pinned Stellar CLI
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd
        with:
          version: 28.1.0

      - name: Verify Stellar CLI version
        run: |
          stellar --version
          test "$(stellar --version | awk 'NR == 1 { print $2 }')" = "28.1.0"

      - name: Build contract
        run: stellar contract build --locked --package procuresettle

  flagship:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert checked-out PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          echo "Checked out $actual"
          test "$actual" = "$EXPECTED_HEAD"

      - name: Configure hosted proof paths
        shell: bash
        run: |
          echo "STELLAR_CONFIG_DIR=$RUNNER_TEMP/procuresettle-config" >> "$GITHUB_ENV"
          echo "REPORT_DIR=$RUNNER_TEMP/procuresettle-reports" >> "$GITHUB_ENV"
          echo "QUICKSTART_CONTAINER=stellar-procuresettle-local-proof" >> "$GITHUB_ENV"
          echo "QUICKSTART_IMAGE_DIGEST=sha256:4f8dfd693deba57fddef7f0bc722e4782c2e606c8675e3adc5438cebae249295" >> "$GITHUB_ENV"
          echo "QUICKSTART_IMAGE_TAG=procuresettle-proof-4f8dfd693deb" >> "$GITHUB_ENV"

      - name: Install pinned Rust and WASM target
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 wasm32v1-none
          rustc +1.95.0 --version
          cargo +1.95.0 --version
          python3 --version
          git rev-parse HEAD

      - name: Install pinned Stellar CLI
        uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd
        with:
          version: 28.1.0

      - name: Verify Stellar CLI version
        run: |
          stellar --version
          test "$(stellar --version | awk 'NR == 1 { print $2 }')" = "28.1.0"

      - name: Build ProcureSettle
        run: |
          stellar contract build --locked --package procuresettle
          sha256sum target/wasm32v1-none/release/procuresettle.wasm
          test "$(stat -c '%s' target/wasm32v1-none/release/procuresettle.wasm)" = "25484"
          test "$(sha256sum target/wasm32v1-none/release/procuresettle.wasm | awk '{print $1}')" = "78b5c6dec22ad1cea497223ff411af544dcd1e9fd613b85514f2c5ae03873a7c"

      - name: Install pinned proof SDK dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-proof.txt

      - name: Verify proof SDK version
        run: |
          python3 -c 'import stellar_sdk; print("stellar-sdk", stellar_sdk.__version__); assert stellar_sdk.__version__ == "13.1.0"'

      - name: Pull and tag pinned Quickstart image
        run: |
          set -euo pipefail
          image="stellar/quickstart@$QUICKSTART_IMAGE_DIGEST"
          tag="stellar/quickstart:$QUICKSTART_IMAGE_TAG"
          docker pull "$image"
          docker tag "$image" "$tag"
          digest_image_id=$(docker image inspect "$image" --format '{{.Id}}')
          tagged_image_id=$(docker image inspect "$tag" --format '{{.Id}}')
          test "$digest_image_id" = "$tagged_image_id"
          echo "Pinned Quickstart image: $image (image_id=$digest_image_id)"

      - name: Start fresh local Stellar network
        run: |
          stellar --config-dir "$STELLAR_CONFIG_DIR" container start local \
            --name procuresettle-local-proof --cpus 2 --memory 4g \
            --protocol-version 28 --image-tag-override "$QUICKSTART_IMAGE_TAG"
          stellar --config-dir "$STELLAR_CONFIG_DIR" network use local

      - name: Wait for local network readiness and record image identity
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail http://localhost:8000/health \
                --output "$RUNNER_TEMP/quickstart-health.json" 2>/dev/null \
              && jq -e '.database_connected == true and .core_up == true and .core_synced == true' \
                "$RUNNER_TEMP/quickstart-health.json" >/dev/null \
              && curl --silent --show-error --fail http://localhost:8000/ \
                --output "$RUNNER_TEMP/quickstart-horizon-root.json" \
              && stellar --config-dir "$STELLAR_CONFIG_DIR" network info --network local \
                >"$RUNNER_TEMP/stellar-network-info.txt" 2>&1 \
              && grep -Fq 'Protocol Version: 28' "$RUNNER_TEMP/stellar-network-info.txt" \
              && grep -Fq 'Standalone Network ; February 2017' "$RUNNER_TEMP/stellar-network-info.txt"; then
              ready=true
              break
            fi
            sleep 5
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/quickstart-health.json" 2>/dev/null || true
            cat "$RUNNER_TEMP/stellar-network-info.txt" 2>/dev/null || true
            exit 1
          fi
          cat "$RUNNER_TEMP/stellar-network-info.txt"
          cat "$RUNNER_TEMP/quickstart-health.json"
          image_id=$(docker inspect "$QUICKSTART_CONTAINER" --format '{{.Image}}')
          expected_image_id=$(docker image inspect "stellar/quickstart:$QUICKSTART_IMAGE_TAG" --format '{{.Id}}')
          test "$image_id" = "$expected_image_id"
          docker inspect "$QUICKSTART_CONTAINER" --format 'container_image={{.Config.Image}} image_id={{.Image}}'
          docker image inspect "$image_id" --format 'quickstart_version={{index .Config.Labels "org.opencontainers.image.version"}} quickstart_revision={{index .Config.Labels "org.opencontainers.image.revision"}} repo_digests={{json .RepoDigests}}'

      - name: Create local proof identities and SAC
        id: local_setup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$STELLAR_CONFIG_DIR"
          for identity in stage6-issuer stage6-buyer stage6-supplier; do
            stellar --config-dir "$STELLAR_CONFIG_DIR" keys generate "$identity"
          done
          for identity in stage6-issuer stage6-buyer stage6-supplier; do
            address=$(stellar --config-dir "$STELLAR_CONFIG_DIR" keys public-key "$identity")
            # The classic trustline and asset setup below uses Horizon-backed
            # Stellar transactions. Wait for the actual account API route,
            # rather than relying only on Quickstart health and its root page.
            horizon_ready=false
            for attempt in $(seq 1 30); do
              horizon_status=$(curl --silent --show-error \
                --output "$RUNNER_TEMP/horizon-probe-${identity}.json" \
                --write-out '%{http_code}' \
                "http://localhost:8000/accounts/$address" || true)
              if [ "$horizon_status" = "404" ]; then
                horizon_ready=true
                break
              fi
              if [ "$horizon_status" = "200" ] \
                && jq -e --arg address "$address" \
                  '.account_id == $address' \
                  "$RUNNER_TEMP/horizon-probe-${identity}.json" >/dev/null; then
                horizon_ready=true
                break
              fi
              echo "Horizon account API HTTP $horizon_status for $identity (readiness attempt $attempt)"
              if [ "$attempt" -lt 30 ]; then sleep 2; fi
            done
            if [ "$horizon_ready" != true ]; then
              cat "$RUNNER_TEMP/horizon-probe-${identity}.json" 2>/dev/null || true
              echo "Horizon account API did not become ready for $identity after 30 attempts" >&2
              exit 1
            fi

            # Quickstart Friendbot can transiently return 502, and the CLI's
            # keys fund parser has rejected otherwise usable responses. Retry
            # the local endpoint, but accept funding only after Horizon confirms
            # the generated account exists.
            account_ready=false
            funding_submitted=false
            for attempt in $(seq 1 30); do
              if [ "$funding_submitted" != true ]; then
                if friendbot_status=$(curl --silent --show-error \
                    --output "$RUNNER_TEMP/friendbot-${identity}.json" \
                    --write-out '%{http_code}' \
                    "http://localhost:8000/friendbot?addr=$address"); then
                  echo "Friendbot HTTP $friendbot_status for $identity (attempt $attempt)"
                  case "$friendbot_status" in
                    200|400) funding_submitted=true ;;
                  esac
                else
                  echo "Friendbot request failed for $identity (attempt $attempt)" >&2
                fi
              fi
              if curl --silent --show-error --fail \
                  "http://localhost:8000/accounts/$address" \
                  --output "$RUNNER_TEMP/account-${identity}.json" \
                && jq -e --arg address "$address" '.account_id == $address' \
                  "$RUNNER_TEMP/account-${identity}.json" >/dev/null; then
                account_ready=true
                break
              fi
              if [ "$attempt" -lt 30 ]; then sleep 2; fi
            done
            if [ "$account_ready" != true ]; then
              cat "$RUNNER_TEMP/friendbot-${identity}.json" 2>/dev/null || true
              cat "$RUNNER_TEMP/account-${identity}.json" 2>/dev/null || true
              echo "Quickstart did not expose funded account $identity through Horizon after 30 attempts" >&2
              exit 1
            fi
          done
          issuer=$(stellar --config-dir "$STELLAR_CONFIG_DIR" keys public-key stage6-issuer)
          buyer=$(stellar --config-dir "$STELLAR_CONFIG_DIR" keys public-key stage6-buyer)
          supplier=$(stellar --config-dir "$STELLAR_CONFIG_DIR" keys public-key stage6-supplier)
          asset="LSP:$issuer"
          stellar --config-dir "$STELLAR_CONFIG_DIR" tx new change-trust \
            --source-account stage6-buyer --line "$asset" --network local
          stellar --config-dir "$STELLAR_CONFIG_DIR" tx new change-trust \
            --source-account stage6-supplier --line "$asset" --network local
          stellar --config-dir "$STELLAR_CONFIG_DIR" tx new payment \
            --source-account stage6-issuer --destination "$buyer" \
            --asset "$asset" --amount 1000 --network local
          sac=$(stellar --config-dir "$STELLAR_CONFIG_DIR" contract asset deploy \
            --asset "$asset" --source-account stage6-issuer --network local)
          echo "STAGE6_BUYER=$buyer" >> "$GITHUB_ENV"
          echo "STAGE6_SUPPLIER=$supplier" >> "$GITHUB_ENV"
          echo "STAGE6_SAC=$sac" >> "$GITHUB_ENV"
          echo "Local issuer: $issuer"
          echo "Local buyer: $buyer"
          echo "Local supplier: $supplier"
          echo "Local asset: $asset"
          echo "Local SAC: $sac"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Run real local flagship proof
        run: |
          python3 scripts/local-flagship-proof.py \
            --config-dir "$STELLAR_CONFIG_DIR" \
            --wasm target/wasm32v1-none/release/procuresettle.wasm \
            --report-dir "$REPORT_DIR" \
            --issuer-identity stage6-issuer \
            --buyer-identity stage6-buyer --buyer-address "$STAGE6_BUYER" \
            --supplier-identity stage6-supplier --supplier-address "$STAGE6_SUPPLIER" \
            --sac-id "$STAGE6_SAC"

      - name: Run local cancellation and refund proof
        if: ${{ !cancelled() && steps.local_setup.outputs.ready == 'true' }}
        run: |
          python3 scripts/local-cancellation-proof.py \
            --config-dir "$STELLAR_CONFIG_DIR" \
            --wasm target/wasm32v1-none/release/procuresettle.wasm \
            --report-dir "$REPORT_DIR" \
            --issuer-identity stage6-issuer \
            --buyer-identity stage6-buyer --buyer-address "$STAGE6_BUYER" \
            --supplier-identity stage6-supplier --supplier-address "$STAGE6_SUPPLIER" \
            --sac-id "$STAGE6_SAC"

      - name: Preserve raw proof output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procuresettle-hosted-flagship-proof
          path: ${{ runner.temp }}/procuresettle-reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Stop local Stellar network
        if: always()
        shell: bash
        run: |
          if docker container inspect "$QUICKSTART_CONTAINER" >/dev/null 2>&1; then
            stellar --config-dir "$STELLAR_CONFIG_DIR" container stop procuresettle-local-proof
          fi
